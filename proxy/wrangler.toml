name = "levelchef-recipe-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
# Used when GEMINI_MODEL is still overloaded after a retry (503/500), out of its daily quota (429) or
# gone (404). Free-tier daily limits are per model, so this also adds its quota to the day. "" = off.
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
# Thinking level for the fallback; "" = model default (a lite model may not accept GEMINI_THINKING_LEVEL).
GEMINI_FALLBACK_THINKING_LEVEL = ""
# Single-user phase: one device may use the whole free-tier day. Lower it (e.g. to 5) before more
# people use the app, so one device can't starve everyone else.
DEVICE_DAILY_LIMIT = "20"
IP_DAILY_LIMIT = "20"
# Must not exceed the Gemini key's own daily quota: the free tier allows 20 requests/day for this
# model, a hard limit on Google's side — raising this number alone gains nothing.
GLOBAL_DAILY_LIMIT = "20"
# Upstream attempts per IP per day, failed ones included — stops hammering a failing Gemini.
ATTEMPT_DAILY_LIMIT = "60"
MAX_OUTPUT_TOKENS = "4096"
# Gemini 3 reasoning depth; the model default can exceed Cloudflare's 100 s response limit. "" = model default.
GEMINI_THINKING_LEVEL = "low"

# Create with `npx wrangler kv namespace create RATE_LIMITS` and paste the printed id here.
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "6d07290781764d46a39aae90fd3c4636"

# The Gemini key is a secret, never committed: `npx wrangler secret put GEMINI_API_KEY`.

# Per-IP burst limiter (KV counters are not atomic): at most 3 requests per minute per IP.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60
