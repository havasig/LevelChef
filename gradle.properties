org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# iOS (Kotlin/Native Apple) targets can only be compiled/linked on a macOS host with Xcode; on other
# hosts (CI's ubuntu-latest job) Kotlin automatically disables those targets' tasks instead of failing
# the build — this just silences the resulting "target X is disabled" warning noise in CI logs.
kotlin.native.ignoreDisabledTargets=true

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
