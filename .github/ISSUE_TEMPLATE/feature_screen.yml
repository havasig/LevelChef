name: Feature screen
description: Build a new feature screen from its Figma node (all current screens are already built).
title: "feat(<module>): build <screen> screen from Figma"
labels: [ feature-screen ]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: The new or existing feature:* module this screen belongs to (e.g. feature:mealprep).
      placeholder: "feature:<name>"
    validations:
      required: true
  - type: input
    id: figma-node
    attributes:
      label: Figma node
      description: The node ID(s) in the LevelChef Figma file for this screen.
      placeholder: "NNN:NNN"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / notes
      description: New design-system components, domain interfaces, or nav wiring expected. Anything to leave stubbed.
    validations:
      required: false
  - type: checkboxes
    id: workflow
    attributes:
      label: Workflow
      options:
        - label: Use the `new-feature-screen` skill and follow the `feature:home` pattern
        - label: Present a plan before implementing
