name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          # Persist the Gradle configuration cache across runs (it is stored encrypted).
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build, lint, detekt, architecture tests & coverage reports
        run: ./gradlew build detekt :konsist:test koverXmlReport koverHtmlReport --stacktrace

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Test report

      - name: Coverage comment
        uses: madrapps/jacoco-report@v1.7.1
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        with:
          paths: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Logic-layer coverage
          update-comment: true

      - name: Verify 90% logic-layer coverage
        run: ./gradlew koverVerify --stacktrace

      - name: Dependency analysis (advisory)
        run: ./gradlew buildHealth --stacktrace

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  ios-build:
    # The build job above runs on ubuntu-latest, where Kotlin/Native silently skips every iOS
    # compile/link task (see levelchef.kmp.library's comment) — so it never actually catches an
    # iOS-breaking change. This job runs on macOS and builds the real Xcode project end to end
    # (its Run Script phase invokes ./gradlew :shared:embedAndSignAppleFrameworkForXcode) rather
    # than just linking the Gradle framework — a linker-flag bug in the app target itself (see the
    # -lsqlite3 fix) only surfaces once the actual iosApp target links, which a Gradle-only check
    # never exercises.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build iosApp for the simulator
        working-directory: iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            'EXCLUDED_ARCHS[sdk=iphonesimulator*]=x86_64' \
            build
