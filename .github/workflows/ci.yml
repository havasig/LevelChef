name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build, lint, detekt & architecture tests
        run: ./gradlew build detekt :konsist:test --stacktrace --no-daemon

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Test report

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
